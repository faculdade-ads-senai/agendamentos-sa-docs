openapi: 3.0.3
info:
  title: Agenda SA API
  version: 1.5.0
  description: |
    Contrato atual de autenticação Google OIDC com sessão HTTP, sem senha ou JWT próprio.
    Perfis exclusivos ADMIN, MEDICO e PACIENTE. Migração V6 preserva dados da V5.
    Cookies HttpOnly; clientes usam credentials include. Escritas exigem o headerName/token
    de GET /auth/csrf, inclusive logout. Token renovado após login/logout e rejeição CSRF.
    API retorna Problem Details 401/403; não redireciona fetch para login.
    Rejeição CSRF inclui code=csrf_invalid (403); repetição limitada a uma após renovar token.
    Usuários desconhecidos/pendentes sem convite/inativos não recebem sessão autenticada.
    Primeiro vínculo somente com convite válido, exceto Master provisionado por MASTER_EMAIL.
    Falhas de navegação OAuth retornam a FRONTEND_URL com auth_error=login_failed;
    convite inválido/expirado retorna auth_error=invite_invalid. Sem detalhes de identidade.
    x-status implementado significa código neste checkout, não validação com Google real.
    Rotas dos módulos médicos, agendas, agendamentos e notificações permanecem planejadas
    neste checkout; referências ao PR #2 não significam que houve merge.
    Datas ISO-8601 com fuso; exibição America/Sao_Paulo. Clínica única.
    Histórico JWT substituído em historico/openapi-1.3.0.yaml. Matriz em CONFORMIDADE.md.

    Cadastro completo para ADMIN, MEDICO e PACIENTE: CPF, nascimento, nome e email obrigatorios em novos cadastros. Telefone/endereco opcionais. CPF sem pontuacao antes de AES-GCM e HMAC; nunca em texto puro no banco. Legados e Master automatico podem permanecer incompletos ate regularizacao administrativa.

servers:
  - url: http://localhost:8080/api/v1
    description: Desenvolvimento local
tags:
  - name: Autenticação
  - name: Usuários
  - name: Médicos
  - name: Agendas
  - name: Agendamentos
  - name: Notificações

paths:
  /oauth2/authorization/google:
    servers: [ { url: 'http://localhost:8080' } ]
    get:
      tags: [ Autenticação ]
      summary: Iniciar login Google por navegação completa
      x-status: implementado
      security: []
      responses:
        '302': { description: Redireciona ao Google com state e nonce }
  /login/oauth2/code/google:
    servers: [ { url: 'http://localhost:8080' } ]
    get:
      tags: [ Autenticação ]
      summary: Callback OIDC gerenciado pelo Spring Security
      x-status: implementado
      security: []
      responses:
        '302': { description: 'Sucesso para FRONTEND_URL; falha para FRONTEND_URL?auth_error=login_failed' }
  /auth/status:
    get:
      tags: [ Autenticação ]
      summary: Consultar estado da sessão
      x-status: implementado
      security: []
      responses:
        '200':
          description: Estado sem cache
          content:
            application/json:
              schema:
                type: object
                required: [ autenticado ]
                properties:
                  autenticado: { type: boolean }
  /auth/csrf:
    get:
      tags: [ Autenticação ]
      summary: Recuperar token CSRF da sessão
      x-status: implementado
      security: []
      responses:
        '200':
          description: Token sem cache; cria sessão se necessário
          content:
            application/json:
              schema:
                type: object
                required: [ headerName, token ]
                properties:
                  headerName: { type: string, example: X-CSRF-TOKEN }
                  token: { type: string }
  /auth/logout:
    post:
      tags: [ Autenticação ]
      summary: Invalidar sessão local e remover cookie
      x-status: implementado
      description: Exige CSRF. Não desconecta a conta Google do navegador.
      responses:
        '204': { description: Sessão invalidada }
        '403': { $ref: '#/components/responses/Proibido' }
  /auth/me:
    get:
      tags: [ Autenticação ]
      summary: Consultar o usuário da sessão
      description: |
        Devolve o usuário autenticado, lido do banco a cada requisição; usuário desativado
        recebe 401. Usado pelo painel para restaurar a sessão.
      operationId: consultarUsuarioAutenticado
      x-status: implementado
      x-origem: master
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /usuarios/me:
    get:
      tags: [ Usuários ]
      summary: Consultar o próprio cadastro
      operationId: consultarMeuUsuario
      x-status: implementado
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
    patch:
      tags: [ Usuários ]
      summary: Atualizar o próprio cadastro
      description: Atualiza somente nome e contato proprio. CPF/nascimento/email/perfil/estado nao sao aceitos,
        inclusive para ADMIN.
      operationId: atualizarMeuUsuario
      x-status: implementado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarMeuUsuarioRequest'
      responses:
        '200':
          description: Cadastro atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '409':
          $ref: '#/components/responses/Conflito'

  /usuarios:
    post:
      tags: [ Usuários ]
      summary: Criar usuário
      description: |
        ADMIN cria cadastro ativo administrativamente e pendente de ativação por convite.
        Nome até 120 e e-mail até 254 caracteres; e-mail normalizado e único inclusive entre inativos.
        Sem senha, googleSub ou cadastro público. Convite é operação separada.
      operationId: criarUsuario
      x-status: implementado
      x-origem: master
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarUsuarioRequest'
      responses:
        '201':
          description: Usuário criado
          headers:
            Location:
              description: URL do usuário criado
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/Proibido'
        '409':
          description: E-mail já cadastrado, inclusive em gravações concorrentes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
    get:
      tags: [ Usuários ]
      summary: Listar usuários
      description: |
        Lista paginada de todos os perfis, inclusive inativos. Restrito a `ADMIN`.
        Atende ao RF-008 (consulta de pacientes pelo
        administrador) e substitui a rota de listagem de pacientes da versão 1.0.0.
        Os filtros `perfil` e `busca` ainda não existem no código.
      operationId: listarUsuarios
      x-status: implementado
      x-origem: master
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Um campo e a direção, separados por vírgula.
          schema:
            type: string
            default: id,asc
            pattern: '^(id|nome|email|perfil|ativo|criadoEm|atualizadoEm),([aA][sS][cC]|[dD][eE][sS][cC])$'
            example: nome,asc
        - name: perfil
          in: query
          description: Filtro por perfil. Planejado, ainda não implementado.
          x-status: planejado
          schema:
            $ref: '#/components/schemas/Perfil'
        - name: busca
          in: query
          description: Busca por nome ou e-mail. Planejado, ainda não implementado.
          x-status: planejado
          schema:
            type: string
      responses:
        '200':
          description: Página de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuarios'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/Proibido'

  /usuarios/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    get:
      tags: [ Usuários ]
      summary: Consultar usuário
      description: Restrito a `ADMIN`.
      operationId: consultarUsuario
      x-status: implementado
      x-origem: master
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags: [ Usuários ]
      summary: Atualizar usuário
      description: |
        Substitui nome, email, perfil e ativo. ADMIN + CSRF. Sem senha.
        Master não pode ser desativado nem mudar email/perfil. Próprio perfil é protegido.
        E-mail vinculado ao Google não pode mudar; mudança de e-mail pendente revoga convites.
        Conflitos protegidos retornam 409. Reativar não dispensa convite.
      operationId: atualizarUsuario
      x-status: implementado
      x-origem: master
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarUsuarioRequest'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
    delete:
      tags: [ Usuários ]
      summary: Desativar usuário
      description: |
        Desativação lógica; preserva agendamentos e histórico. Retorna 204 também quando o
        usuário já está inativo. Restrito a `ADMIN`.
      operationId: desativarUsuario
      x-status: implementado
      x-origem: master
      responses:
        '204':
          description: Usuário desativado
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /usuarios/{usuarioId}/convites:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
    post:
      tags: [ Usuários ]
      summary: Emitir convite para usuário pendente
      description: ADMIN + CSRF; sem corpo. Revoga anteriores; bloqueado/Master/vinculado retorna 409.
      x-status: implementado
      responses:
        '201':
          description: Convite com link de uso único; não registrar em logs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConviteResponse' }
        '403': { $ref: '#/components/responses/Proibido' }
        '409': { $ref: '#/components/responses/Conflito' }
    get:
      tags: [ Usuários ]
      summary: Listar convites do usuário
      description: Restrito a ADMIN; tokens originais não são recuperáveis.
      x-status: implementado
      responses:
        '200':
          description: Lista de convites, link null
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConviteResponse' }
  /usuarios/{usuarioId}/convites/{conviteId}:
    parameters:
      - $ref: '#/components/parameters/UsuarioId'
      - name: conviteId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [ Usuários ]
      summary: Revogar convite
      description: ADMIN + CSRF; vínculo inválido ou convite usado retorna 409.
      x-status: implementado
      responses:
        '204': { description: Convite revogado }
        '409': { $ref: '#/components/responses/Conflito' }
  /convite/{token}:
    servers: [ { url: 'http://localhost:8080' } ]
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ Autenticação ]
      summary: Abrir convite em navegação completa
      x-status: implementado
      security: []
      responses:
        '302': { description: 'Google ou FRONTEND_URL?auth_error=invite_invalid; no-store e no-referrer' }

  /medicos:
    get:
      tags: [ Médicos ]
      summary: Listar médicos
      operationId: listarMedicos
      x-status: planejado
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: ativo
          in: query
          schema:
            type: boolean
        - name: especialidade
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Página de médicos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMedicos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
    post:
      tags: [ Médicos ]
      summary: Cadastrar médico
      description: |
        Requer perfil `ADMIN`. CRM e UF juntos são únicos. O `email` é a conta Google com que o
        médico vai entrar: a operação cria o usuário `MEDICO` com esse e-mail e liga ao cadastro
        do médico (`medico.usuario_id`, V4). E-mail já usado devolve 409.
      operationId: cadastrarMedico
      x-status: planejado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicoRequest'
      responses:
        '201':
          description: Médico cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '403':
          $ref: '#/components/responses/Proibido'
        '409':
          $ref: '#/components/responses/Conflito'

  /medicos/{medicoId}:
    parameters:
      - $ref: '#/components/parameters/MedicoId'
    get:
      tags: [ Médicos ]
      summary: Consultar médico
      operationId: consultarMedico
      x-status: planejado
      responses:
        '200':
          description: Médico encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoResponse'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags: [ Médicos ]
      summary: Atualizar ou desativar médico
      description: Requer perfil `ADMIN`. A propriedade `ativo` faz a desativação lógica.
      operationId: atualizarMedico
      x-status: planejado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarMedicoRequest'
      responses:
        '200':
          description: Médico atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'

  /medicos/{medicoId}/agenda:
    parameters:
      - $ref: '#/components/parameters/MedicoId'
    get:
      tags: [ Agendas ]
      summary: Consultar agenda semanal do médico
      description: Requer usuário autenticado. Retorna só as janelas ativas, por dia e hora de início.
      operationId: consultarAgendaMedico
      x-status: planejado
      x-origem: PR #2 (fora deste checkout)
      responses:
        '200':
          description: Agenda semanal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaMedicoResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags: [ Agendas ]
      summary: Substituir agenda semanal do médico
      description: |
        Requer perfil `ADMIN`. A lista enviada passa a ser a agenda ativa completa;
        lista vazia desativa a agenda semanal. Janelas do mesmo dia não podem se sobrepor
        (adjacentes são aceitas) e cada janela precisa comportar ao menos uma consulta.
        Consultas já marcadas são mantidas.
      operationId: substituirAgendaMedico
      x-status: planejado
      x-origem: PR #2 (fora deste checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaMedicoRequest'
      responses:
        '200':
          description: Agenda atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaMedicoResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Médico inativo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/RegraViolada'

  /medicos/{medicoId}/bloqueios:
    parameters:
      - $ref: '#/components/parameters/MedicoId'
    get:
      tags: [ Agendas ]
      summary: Listar bloqueios ativos do médico
      description: Requer perfil `ADMIN`. Ordenados pelo início.
      operationId: listarBloqueiosAgenda
      x-status: planejado
      x-origem: PR #2 (fora deste checkout)
      responses:
        '200':
          description: Bloqueios ativos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloqueioAgendaResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags: [ Agendas ]
      summary: Criar bloqueio de agenda
      description: |
        Requer perfil `ADMIN`. Não cancela consultas: se houver consulta `AGENDADA`
        no período, o bloqueio é recusado com 409.
      operationId: criarBloqueioAgenda
      x-status: planejado
      x-origem: PR #2 (fora deste checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueioAgendaRequest'
      responses:
        '201':
          description: Bloqueio criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueioAgendaResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Médico inativo ou consultas agendadas no período
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/RegraViolada'

  /medicos/{medicoId}/bloqueios/{bloqueioId}:
    parameters:
      - $ref: '#/components/parameters/MedicoId'
      - name: bloqueioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      tags: [ Agendas ]
      summary: Desativar bloqueio de agenda
      description: |
        Requer perfil `ADMIN`. Exclusão lógica, para manter rastreabilidade;
        repetir a chamada num bloqueio existente também retorna 204.
      operationId: desativarBloqueioAgenda
      x-status: planejado
      x-origem: PR #2 (fora deste checkout)
      responses:
        '204':
          description: Bloqueio desativado
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /medicos/{medicoId}/horarios-disponiveis:
    parameters:
      - $ref: '#/components/parameters/MedicoId'
      - name: data
        in: query
        required: true
        description: Dia consultado, no fuso `America/Sao_Paulo`.
        schema:
          type: string
          format: date
          example: '2026-11-17'
    get:
      tags: [ Agendas ]
      summary: Consultar horários disponíveis
      description: |
        Requer usuário autenticado. Gera os horários pela duração de cada janela e retira os
        que já passaram, os que cruzam bloqueio ativo e os ocupados por consulta `AGENDADA`.
        Médico inativo ou data passada retornam lista vazia. O resultado é uma fotografia: a
        confirmação do agendamento revalida o horário.
      operationId: consultarHorariosDisponiveis
      x-status: planejado
      x-origem: PR #2 (fora deste checkout)
      responses:
        '200':
          description: Horários livres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HorarioDisponivel'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /agendamentos:
    post:
      tags: [ Agendamentos ]
      summary: Criar agendamento
      operationId: criarAgendamento
      x-status: planejado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarAgendamentoRequest'
      responses:
        '201':
          description: Agendamento confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendamentoResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '409':
          description: Horário indisponível ou conflito concorrente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: Horário fora da agenda, no passado ou com médico inativo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
    get:
      tags: [ Agendamentos ]
      summary: Listar agendamentos para administração
      description: Requer perfil `ADMIN`.
      operationId: listarAgendamentos
      x-status: planejado
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: inicio
          in: query
          schema:
            type: string
            format: date
        - name: fim
          in: query
          schema:
            type: string
            format: date
        - name: medicoId
          in: query
          schema:
            type: integer
            format: int64
        - name: pacienteId
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusAgendamento'
      responses:
        '200':
          description: Página de agendamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAgendamentos'
        '403':
          $ref: '#/components/responses/Proibido'

  /agendamentos/me:
    get:
      tags: [ Agendamentos ]
      summary: Listar os próprios agendamentos
      description: |
        Paciente: as próprias consultas. Médico: as consultas da própria agenda (do médico ligado
        ao usuário). Próximas e histórico saem do mesmo resultado, filtrando por status e data.
      operationId: listarMeusAgendamentos
      x-status: planejado
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusAgendamento'
      responses:
        '200':
          description: Página de agendamentos do paciente autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAgendamentos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /agendamentos/{agendamentoId}:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    get:
      tags: [ Agendamentos ]
      summary: Consultar agendamento
      description: |
        Paciente acessa apenas o próprio registro; médico, as consultas da própria agenda;
        `ADMIN`, qualquer registro. Consulta de outra pessoa devolve 404.
      operationId: consultarAgendamento
      x-status: planejado
      responses:
        '200':
          description: Agendamento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendamentoResponse'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /agendamentos/{agendamentoId}/reagendamento:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    patch:
      tags: [ Agendamentos ]
      summary: Reagendar consulta
      description: |
        Regras do DEC-03 (17/11/2026):
        - paciente: só as próprias consultas, até 24 horas antes do início;
        - `ADMIN`: qualquer consulta, sem prazo mínimo;
        - médico não reagenda (cancela, e o paciente ou o administrador marca de novo);
        - só consultas futuras com status `AGENDADA`; o novo horário passa pelas mesmas
          validações da criação, na mesma transação;
        - `motivo` é opcional e vai só no texto do aviso;
        - avisa o paciente e o médico da consulta, menos quem reagendou (caixa de entrada e
          e-mail com o convite de agenda atualizado).

        Erros: 404 para consulta de outra pessoa ou perfil sem permissão; 409 para horário
        ocupado; 422 para consulta passada, já cancelada ou a menos de 24 horas (paciente).
      operationId: reagendarConsulta
      x-status: planejado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReagendarAgendamentoRequest'
      responses:
        '200':
          description: Consulta reagendada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendamentoResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraViolada'

  /agendamentos/{agendamentoId}/cancelamento:
    parameters:
      - $ref: '#/components/parameters/AgendamentoId'
    patch:
      tags: [ Agendamentos ]
      summary: Cancelar consulta
      description: |
        Regras do DEC-03 (17/11/2026):
        - paciente: só as próprias consultas, até 24 horas antes do início;
        - médico: só as consultas da própria agenda, sem prazo mínimo;
        - `ADMIN`: qualquer consulta, sem prazo mínimo;
        - só consultas futuras com status `AGENDADA`;
        - `motivo` é obrigatório para todos (o banco recusa cancelamento sem motivo, V4);
        - grava `cancelado_em` e `cancelado_por_id`, libera o horário e mantém a consulta no
          histórico;
        - avisa o paciente e o médico da consulta, menos quem cancelou (caixa de entrada e
          e-mail com o convite de cancelamento).

        Erros: 400 sem motivo; 404 para consulta de outra pessoa ou perfil sem permissão; 422
        para consulta passada, já cancelada ou a menos de 24 horas (paciente), com mensagem
        para falar com a clínica.
      operationId: cancelarConsulta
      x-status: planejado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarAgendamentoRequest'
      responses:
        '200':
          description: Consulta cancelada e horário liberado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendamentoResponse'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraViolada'

  /notificacoes/me:
    get:
      tags: [ Notificações ]
      summary: Listar as próprias notificações
      description: |
        Caixa de entrada do app e do painel: as notificações do canal `SISTEMA` do usuário
        autenticado. As do canal `EMAIL` são enviadas em segundo plano e não aparecem aqui.
      operationId: listarMinhasNotificacoes
      x-status: planejado
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: somenteNaoLidas
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Página de notificações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaNotificacoes'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /notificacoes/{notificacaoId}/leitura:
    parameters:
      - name: notificacaoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags: [ Notificações ]
      summary: Marcar notificação como lida
      operationId: marcarNotificacaoComoLida
      x-status: planejado
      responses:
        '204':
          description: Notificação marcada como lida
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /usuarios/{usuarioId}/dados-pessoais:
    parameters:
      - $ref: "#/components/parameters/UsuarioId"
    get:
      tags:
        - Usuários
      summary: Consultar dados pessoais (ADMIN)
      description: ADMIN consulta qualquer registro, inclusive o proprio. Outros perfis recebem 403.
      x-status: implementado
      responses:
        "200":
          description: Dados pessoais, Cache-Control no-store; campos legados ausentes sao nulos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DadosPessoaisResponse"
        "401":
          $ref: "#/components/responses/NaoAutorizado"
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
  /usuarios/me/dados-pessoais:
    get:
      tags:
        - Usuários
      summary: Consultar dados pessoais proprios
      description: Proprietario identificado pelo sub Google, nunca por parametro do cliente.
      x-status: implementado
      responses:
        "200":
          description: Dados pessoais, Cache-Control no-store; campos legados ausentes sao nulos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DadosPessoaisResponse"
        "401":
          $ref: "#/components/responses/NaoAutorizado"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Cookie HttpOnly estabelecido pelo Spring; nunca manipulado pelo JavaScript.

  parameters:
    Page:
      name: page
      in: query
      description: Número da página, começando em 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MedicoId:
      name: medicoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AgendamentoId:
      name: agendamentoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    NaoAutorizado:
      description: Usuário não autenticado ou credencial inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Proibido:
      description: Usuário sem permissão para a operação
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Conflito:
      description: Conflito com o estado atual do recurso
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    DadosInvalidos:
      description: Formato ou validação de campos inválidos; a lista `erros` aponta os campos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    RegraViolada:
      description: Os campos são válidos, mas violam uma regra de intervalo ou de agenda
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'

  schemas:
    Perfil:
      type: string
      enum: [ ADMIN, PACIENTE, MEDICO ]
      description: |
        `ADMIN` faz também o papel da recepcionista. `MEDICO` é ligado a um cadastro de médico
        (V4). `RECEPCIONISTA` saiu na V4.
    StatusAgendamento:
      type: string
      enum: [ AGENDADA, CANCELADA, CONCLUIDA ]
    TipoNotificacao:
      type: string
      enum: [ CONFIRMACAO, LEMBRETE, CANCELAMENTO, ALTERACAO ]
    CanalNotificacao:
      type: string
      enum: [ SISTEMA, EMAIL ]
    StatusNotificacao:
      type: string
      enum: [ PENDENTE, ENVIADA, FALHA ]

    Nome:
      type: string
      minLength: 1
      maxLength: 120
      description: Não pode ser vazio; espaços das extremidades são removidos.
    Email:
      type: string
      format: email
      maxLength: 254
      description: Espaços das extremidades são removidos e o valor é salvo em minúsculas.
    CriarUsuarioRequest:
      type: object
      required:
        - nome
        - email
        - perfil
        - dadosPessoais
      properties:
        nome:
          $ref: '#/components/schemas/Nome'
        email:
          $ref: '#/components/schemas/Email'
        perfil:
          $ref: '#/components/schemas/Perfil'
        dadosPessoais:
          $ref: "#/components/schemas/DadosPessoaisRequest"
      example:
        nome: Ana Silva
        email: ana@example.com
        perfil: PACIENTE
        dadosPessoais:
          cpf: "52998224725"
          dataNascimento: 1990-05-20

    AtualizarUsuarioRequest:
      type: object
      required: [ nome, email, perfil, ativo ]
      properties:
        nome:
          $ref: '#/components/schemas/Nome'
        email:
          $ref: '#/components/schemas/Email'
        perfil:
          $ref: '#/components/schemas/Perfil'
        ativo:
          type: boolean
          description: '`true` reativa um usuário inativo.'
        dadosPessoais:
          $ref: "#/components/schemas/DadosPessoaisRequest"
      example:
        nome: Ana Silva
        email: ana@example.com
        perfil: PACIENTE
        ativo: true
      description: dadosPessoais omitido preserva os valores. Se enviado, substitui o conjunto completo; CPF e nascimento
        obrigatorios, contatos nulos/vazios removidos. ADMIN corrige qualquer registro. Legados podem
        atualizar dados comuns sem regularizacao imediata.

    AtualizarMeuUsuarioRequest:
      type: object
      additionalProperties: false
      required:
        - nome
      properties:
        nome:
          $ref: "#/components/schemas/Nome"
        telefone:
          type: string
          nullable: true
          maxLength: 40
          description: Omitido preserva, nulo/vazio remove. Internacional com +.
        endereco:
          type: string
          nullable: true
          maxLength: 500
          description: Omitido preserva, nulo/vazio remove.
      description: Todos os perfis atualizam somente nome e contato. CPF, nascimento, email, perfil e estado sao
        rejeitados; ADMIN usa PUT administrativo para corrigir identidade.

    ConviteResponse:
      type: object
      required: [ id, usuarioId, administradorId, criadoEm, expiraEm, status, link ]
      properties:
        id: { type: integer, format: int64 }
        usuarioId: { type: integer, format: int64 }
        administradorId: { type: integer, format: int64 }
        criadoEm: { type: string, format: date-time }
        expiraEm: { type: string, format: date-time }
        status: { type: string, enum: [ PENDENTE, EXPIRADO, UTILIZADO, REVOGADO ] }
        link: { type: string, nullable: true, description: 'Somente emissão retorna link; consulta retorna null' }

    UsuarioResponse:
      type: object
      description: Senha e hash nunca fazem parte da resposta. As datas são geradas pelo banco.
      required:
        - id
        - nome
        - email
        - perfil
        - ativo
        - criadoEm
        - atualizadoEm
        - statusCadastro
        - master
        - ativadoEm
        - cadastroCompleto
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
          format: email
        perfil:
          $ref: '#/components/schemas/Perfil'
        ativo:
          type: boolean
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time

        statusCadastro: { type: string, enum: [ PENDENTE, ATIVADO ] }
        master: { type: boolean }
        ativadoEm: { type: string, format: date-time, nullable: true }
        cadastroCompleto:
          type: boolean
          description: Presenca dos dados pessoais obrigatorios, independente de perfil, ativo e ativacao Google. Nao
            expor dados pessoais em listagens.

    MedicoRequest:
      type: object
      additionalProperties: false
      required: [ nome, email, crm, ufCrm, especialidade ]
      properties:
        nome:
          $ref: '#/components/schemas/Nome'
        email:
          $ref: '#/components/schemas/Email'
        crm:
          type: string
          minLength: 1
          maxLength: 20
        ufCrm:
          type: string
          pattern: '^[A-Z]{2}$'
        especialidade:
          type: string
          minLength: 1
          maxLength: 100

    AtualizarMedicoRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nome:
          $ref: '#/components/schemas/Nome'
        email:
          $ref: '#/components/schemas/Email'
        crm:
          type: string
          minLength: 1
          maxLength: 20
        ufCrm:
          type: string
          pattern: '^[A-Z]{2}$'
        especialidade:
          type: string
          minLength: 1
          maxLength: 100
        ativo:
          type: boolean

    MedicoResponse:
      allOf:
        - $ref: '#/components/schemas/MedicoRequest'
        - type: object
          required: [ id, ativo, criadoEm, atualizadoEm ]
          properties:
            id:
              type: integer
              format: int64
            ativo:
              type: boolean
            criadoEm:
              type: string
              format: date-time
            atualizadoEm:
              type: string
              format: date-time

    Hora:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$'
      description: Hora local no formato HH:mm ou HH:mm:ss.
      example: '08:00:00'

    AgendaItem:
      type: object
      additionalProperties: false
      required: [ diaSemana, horaInicio, horaFim, duracaoMinutos ]
      properties:
        diaSemana:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO-8601; 1 é segunda-feira e 7 é domingo.
        horaInicio:
          $ref: '#/components/schemas/Hora'
        horaFim:
          $ref: '#/components/schemas/Hora'
        duracaoMinutos:
          type: integer
          minimum: 30
          maximum: 60
          example: 30
          description: Definida pelo médico em cada janela (decisão de 17/11/2026, V4).

    AgendaMedicoRequest:
      type: object
      additionalProperties: false
      required: [ janelas ]
      properties:
        janelas:
          type: array
          description: Agenda completa; lista vazia desativa a agenda semanal.
          items:
            $ref: '#/components/schemas/AgendaItem'
      example:
        janelas:
          - diaSemana: 2
            horaInicio: '08:00:00'
            horaFim: '12:00:00'
            duracaoMinutos: 30

    AgendaMedicoResponse:
      type: object
      required: [ medicoId, janelas ]
      properties:
        medicoId:
          type: integer
          format: int64
        janelas:
          type: array
          items:
            $ref: '#/components/schemas/AgendaItem'

    BloqueioAgendaRequest:
      type: object
      additionalProperties: false
      required: [ inicio, fim, motivo ]
      properties:
        inicio:
          type: string
          format: date-time
          description: Precisa ser anterior a `fim` (senão 422).
        fim:
          type: string
          format: date-time
        motivo:
          type: string
          minLength: 1
          maxLength: 255
      example:
        inicio: '2026-11-17T09:00:00-03:00'
        fim: '2026-11-17T10:00:00-03:00'
        motivo: Reunião

    BloqueioAgendaResponse:
      type: object
      required: [ id, medicoId, inicio, fim, motivo, ativo ]
      properties:
        id:
          type: integer
          format: int64
        medicoId:
          type: integer
          format: int64
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        motivo:
          type: string
        ativo:
          type: boolean

    HorarioDisponivel:
      type: object
      required: [ inicio, fim ]
      properties:
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time

    CriarAgendamentoRequest:
      type: object
      additionalProperties: false
      required: [ medicoId, inicio ]
      properties:
        medicoId:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
          description: Somente `ADMIN` informa outro paciente; para `PACIENTE` é ignorado e usado o usuário autenticado.
        inicio:
          type: string
          format: date-time

    ReagendarAgendamentoRequest:
      type: object
      additionalProperties: false
      required: [ inicio ]
      properties:
        inicio:
          type: string
          format: date-time
        motivo:
          type: string
          maxLength: 255
          description: Opcional; vai só no texto do aviso.

    CancelarAgendamentoRequest:
      type: object
      additionalProperties: false
      required: [ motivo ]
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 255
          description: Obrigatório para todos (DEC-03); não pode ser só espaços.

    AgendamentoResponse:
      type: object
      required: [ id, paciente, medico, inicio, fim, status, criadoEm, atualizadoEm ]
      properties:
        id:
          type: integer
          format: int64
        paciente:
          $ref: '#/components/schemas/UsuarioResumo'
        medico:
          $ref: '#/components/schemas/MedicoResumo'
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusAgendamento'
        motivoCancelamento:
          type: string
          nullable: true
        canceladoEm:
          type: string
          format: date-time
          nullable: true
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time

    UsuarioResumo:
      type: object
      required: [ id, nome ]
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string

    MedicoResumo:
      type: object
      required: [ id, nome, especialidade ]
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        especialidade:
          type: string

    NotificacaoResponse:
      type: object
      required: [ id, agendamentoId, tipo, canal, status, mensagem, criadaEm ]
      properties:
        id:
          type: integer
          format: int64
        agendamentoId:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoNotificacao'
        canal:
          $ref: '#/components/schemas/CanalNotificacao'
        status:
          $ref: '#/components/schemas/StatusNotificacao'
        mensagem:
          type: string
        criadaEm:
          type: string
          format: date-time
        enviadaEm:
          type: string
          format: date-time
          nullable: true
        lidaEm:
          type: string
          format: date-time
          nullable: true

    Pagina:
      type: object
      description: Formato de página do código (`UsuarioPageResponse`), adotado em todas as listagens.
      required: [ page, size, totalElements, totalPages ]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    PaginaUsuarios:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          required: [ content ]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/UsuarioResponse'

    PaginaMedicos:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          required: [ content ]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/MedicoResponse'

    PaginaAgendamentos:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          required: [ content ]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AgendamentoResponse'

    PaginaNotificacoes:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          required: [ content ]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/NotificacaoResponse'

    ErroCampo:
      type: object
      required: [ campo, mensagem ]
      properties:
        campo:
          type: string
        mensagem:
          type: string

    Problema:
      type: object
      description: ProblemDetail (RFC 9457) gerado pelo Spring. Os valores enviados não são repetidos na resposta.
      required: [ type, title, status ]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: csrf_invalid somente para rejeição pelo filtro CSRF
        erros:
          type: array
          description: Presente nos erros de validação de campos e parâmetros.
          items:
            $ref: '#/components/schemas/ErroCampo'
      example:
        type: about:blank
        title: Bad Request
        status: 400
        detail: Dados do usuário inválidos
        instance: /api/v1/usuarios
        erros:
          - campo: email
            mensagem: deve ser um endereço de e-mail bem formado
    DadosPessoaisRequest:
      type: object
      required:
        - cpf
        - dataNascimento
      properties:
        cpf:
          type: string
          pattern: ^(?:[0-9]{11}|[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2})$
          description: CPF com verificadores validos. Unico entre todos os perfis, inclusive inativos; normalizado para
            11 digitos antes de AES-GCM e HMAC.
        dataNascimento:
          type: string
          format: date
          description: Data valida, ano >= 1, nao futura em America/Sao_Paulo. Sem limite de idade; interface confirma
            datas anteriores a 120 anos.
        telefone:
          type: string
          nullable: true
          maxLength: 40
          description: Opcional. Internacional com + e codigo do pais; normalizado para E.164.
        endereco:
          type: string
          nullable: true
          maxLength: 500
          description: Opcional, texto aparado.
    DadosPessoaisResponse:
      type: object
      required:
        - id
        - nome
        - email
        - cpf
        - dataNascimento
        - telefone
        - endereco
        - cadastroCompleto
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
          nullable: true
          description: 11 digitos; apenas consulta especifica autorizada.
        dataNascimento:
          type: string
          format: date
          nullable: true
        telefone:
          type: string
          nullable: true
        endereco:
          type: string
          nullable: true
        cadastroCompleto:
          type: boolean

security:
  - sessionCookie: []
